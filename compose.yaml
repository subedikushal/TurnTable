name: turntable

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: turntable
      POSTGRES_USER: turntable
      POSTGRES_PASSWORD: turntable
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - turntable-postgres-data:/var/lib/postgresql
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U turntable -d turntable']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - turntable-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  turntable-postgres-data:
  turntable-redis-data:
