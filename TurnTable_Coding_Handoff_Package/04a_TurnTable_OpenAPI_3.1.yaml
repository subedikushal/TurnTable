components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - trace_id
      properties:
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        trace_id:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
    User:
      type: object
      required:
      - id
      - display_name
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type:
          - string
          - 'null'
          format: email
    Household:
      type: object
      required:
      - id
      - name
      - timezone
      - currency
      - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
        version:
          type: integer
          minimum: 1
    Member:
      type: object
      required:
      - id
      - household_id
      - user
      - role
      - status
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        role:
          type: string
          enum:
          - OWNER
          - MEMBER
        status:
          type: string
          enum:
          - ACTIVE
          - LEFT
          - REMOVED
    Task:
      type: object
      required:
      - id
      - household_id
      - title
      - status
      - start_local_date
      - timezone
      - due_mode
      - assignment_strategy
      - version
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        title: &id001
          type: string
        description: &id002
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
        recurrence_rule: &id003
          type:
          - string
          - 'null'
        start_local_date: &id004
          type: string
          format: date
        timezone: &id005
          type: string
        due_mode: &id006
          type: string
          enum:
          - ALL_DAY
          - TIME
        due_local_time: &id007
          type:
          - string
          - 'null'
        assignment_strategy: &id008
          type: string
          enum:
          - ROUND_ROBIN
          - FIXED
        fixed_assignee_member_id: &id009
          type:
          - string
          - 'null'
          format: uuid
        rotation_member_ids: &id010
          type: array
          items:
            type: string
            format: uuid
        reminder_offsets_minutes: &id011
          type: array
          maxItems: 3
          items:
            type: integer
            minimum: 0
        version:
          type: integer
    TaskOccurrence:
      type: object
      required:
      - id
      - task_id
      - household_id
      - local_date
      - due_at
      - status
      - is_overdue
      - version
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        local_date:
          type: string
          format: date
        due_at:
          type: string
          format: date-time
        nominal_assignee_member_id:
          type:
          - string
          - 'null'
          format: uuid
        current_assignee_member_id:
          type:
          - string
          - 'null'
          format: uuid
        status:
          type: string
          enum:
          - SCHEDULED
          - COMPLETED
          - SKIPPED
          - CANCELED
        is_overdue:
          type: boolean
        completed_by_member_id:
          type:
          - string
          - 'null'
          format: uuid
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
    SwapRequest:
      type: object
      required:
      - id
      - type
      - source_occurrence_id
      - target_member_id
      - status
      - expires_at
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - SWAP
          - COVER
        source_occurrence_id:
          type: string
          format: uuid
        target_occurrence_id:
          type:
          - string
          - 'null'
          format: uuid
        target_member_id:
          type: string
          format: uuid
        requested_by_member_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - DECLINED
          - CANCELED
          - EXPIRED
        expires_at:
          type: string
          format: date-time
    Expense:
      type: object
      required:
      - id
      - household_id
      - description
      - amount_minor
      - currency
      - payer_member_id
      - category
      - occurred_at
      - split_mode
      - splits
      - status
      - version
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        description:
          type: string
        amount_minor:
          type: integer
        currency:
          type: string
        payer_member_id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        occurred_at:
          type: string
          format: date-time
        split_mode:
          type: string
          enum:
          - EQUAL
          - EXACT
          - PERCENTAGE
          - SHARES
        splits:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseSplitResolved'
        status:
          type: string
          enum:
          - ACTIVE
          - VOIDED
        version:
          type: integer
    ExpenseCategory:
      type: string
      enum:
      - RENT
      - UTILITIES
      - INTERNET
      - GROCERIES
      - HOUSEHOLD_SUPPLIES
      - DINING_SHARED
      - TRANSPORT_SHARED
      - OTHER
    ExpenseSplitResolved:
      type: object
      required:
      - member_id
      - amount_minor
      properties:
        member_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          minimum: 0
    Settlement:
      type: object
      required:
      - id
      - household_id
      - payer_member_id
      - receiver_member_id
      - amount_minor
      - currency
      - settled_at
      - status
      - version
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        payer_member_id:
          type: string
          format: uuid
        receiver_member_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          minimum: 1
        currency:
          type: string
        settled_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ACTIVE
          - VOIDED
        version:
          type: integer
    AnalyticsOverview:
      type: object
      required:
      - from
      - to
      - currency
      - kpis
      - insights
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        currency:
          type: string
        kpis:
          type: object
          additionalProperties: true
        expense_trend:
          type: array
          items:
            type: object
            additionalProperties: true
        expense_categories:
          type: array
          items:
            type: object
            additionalProperties: true
        member_financials:
          type: array
          items:
            type: object
            additionalProperties: true
        responsibility_mix:
          type: array
          items:
            type: object
            additionalProperties: true
        completion_status:
          type: array
          items:
            type: object
            additionalProperties: true
        swap_trend:
          type: array
          items:
            type: object
            additionalProperties: true
        balance_score: {}
        insights:
          type: array
          items:
            type: object
